<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/main.css">
    <script src="./js/main.js" defer></script>
    <title>Hoang Truong</title>
</head>

<body>
    <!-- vertical nav bar on left -->
    <nav>
        <picture>
            <!-- Mobile Image -->
            <source media="(max-width: 600px)" srcset="./media/white-logo.svg">
            <!-- Desktop Image -->
            <source media="(min-width: 601px)" srcset="./media/white-logo.svg">
            <!-- Fallback Image -->
            <img aria-hidden="true" loading="lazy" decoding="async" src="./media/white-logo.svg" alt="hoang">
        </picture>

        <ul>
            <li id="nav-works">work</li>
            <li id="nav-about">about</li>
        </ul>

        <ul>
            <li><a href="mailto:{{replace me}}">Email</a></li>
            <li><a href="https://instagram.com/{{replace me}}">Instagram</a></li>
        </ul>
    </nav>

    <!-- eye logo centered and fixed at top-->
    <picture>
        <source srcset="./media/eye-logo.jpg">
        <!-- Fallback Image -->
        <img aria-hidden="true" loading="lazy" decoding="async" src="./media/eye-logo.jpg" alt="hoang" width="28px"
            height="28px">
    </picture>

    <!-- projects -->
    <div class="grid-container">
        <section id="projects" hidden="true">
            <!-- dynamically generate html here for the 7 projects -->
        </section>

        <!-- about content -->
        <section id="about" hidden="true">

        </section>

        <!-- selected project -->
        <section id="selected-project" hidden="true">

        </section>
    </div>

    <!-- current centered project in viewport -->
    <section id="current-centered-project" hidden="true">

    </section>
</body>

</html>
